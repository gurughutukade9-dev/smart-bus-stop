<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bus Stop</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #08111f;
  color: white;
  text-align: center;
  padding: 20px;
}

.card {
  background: #142238;
  padding: 20px;
  margin: 15px auto;
  max-width: 600px;
  border-radius: 16px;
}

h1 { color: #38bdf8; }

.bus {
  font-size: 30px;
  font-weight: bold;
  color: #4ade80;
}

button {
  padding: 15px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

.next { background: #22c55e; color: black; }
.reset { background: #ef4444; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  padding: 10px;
  border: 1px solid #334155;
}

.small { color: #cbd5e1; }
</style>
</head>

<body>

<h1>🚌 SMART BUS STOP</h1>
<div class="card">
  <h3>NEXT BUS</h3>
  <div class="bus" id="nextBus">Loading...</div>
</div>

<div class="card">
  <h3>Last Trigger</h3>
  <div id="lastBus">--</div>
  <p id="lastTime">--</p>
</div>

<div class="card">
  <h3>Time Gap</h3>
  <div id="gap">--</div>
</div>

<div class="card">
  <h3>Trigger Count</h3>
  <div id="count">0</div>
</div>

<button class="next" onclick="triggerBus()">NEXT BUS</button>
<button class="reset" onclick="resetData()">RESET</button>

<div class="card">
  <h3>📋 Trigger History</h3>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Bus</th>
          <th>Time</th>
          <th>Gap</th>
        </tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>
</div>

<p class="small">Smart Bus Stop System</p>

<script>

const DB = "https://smart-bus-stop-project-default-rtdb.firebaseio.com";

const buses = [
  "BALAJI NAGAR",
  "KATRAJ",
  "SHIVAJINAGAR"
];

let data = {
  nextIndex: 0,
  count: 0,
  lastTime: null,
  history: []
};

let busy = false;

async function loadData() {
  try {
    const r = await fetch(DB + "/busData.json");
    const d = await r.json();

    if (d) data = d;

    render();
  } catch(e) {
    document.getElementById("nextBus").innerText =
      "Database Connection Error";
  }
}

function render()  {
  document.getElementById("nextBus").innerText =
    buses[data.nextIndex || 0];

  document.getElementById("count").innerText =
    data.count || 0;

  document.getElementById("lastBus").innerText =
    data.history && data.history.length
    ? data.history[0].bus
    : "--";

  document.getElementById("lastTime").innerText =
    data.history && data.history.length
    ? data.history[0].time
    : "--";

  document.getElementById("gap").innerText =
    data.history && data.history.length
    ? data.history[0].gap + " seconds"
    : "--";

  let rows = "";

  (data.history || []).forEach(item => {
    rows += `<tr>
      <td>${item.bus}</td>
      <td>${item.time}</td>
      <td>${item.gap} sec</td>
    </tr>`;
  });

  document.getElementById("history").innerHTML = rows;
}

async function triggerBus() {
  if (busy) return;
  busy = true;

  try {
    await loadData();

    const now = Date.now();

    const gap = data.lastTime
      ? Math.round((now - data.lastTime) / 1000)
      : 0;

    const bus = buses[data.nextIndex || 0];

    const record = {
      bus: bus,
      time: new Date(now).toLocaleString("en-IN"),
      gap: gap,
      timestamp: now
    };

    data.history = data.history || [];
    data.history.unshift(record);

    data.count = (data.count || 0) + 1;
    data.lastTime = now;

    data.nextIndex = (data.nextIndex + 1) % buses.length;

    await saveData();

  } catch(e) {
    alert("डेटा सेव्ह झाला नाही!");
  }

  busy = false;
}

async function saveData() {
  const r = await fetch(DB + "/busData.json", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  if (!r.ok) throw new Error("Save failed");

  render();
}

async function resetData() {
  if (!confirm("सर्व History Reset करायची आहे का?")) return;

  data = {
    nextIndex: 0,
    count: 0,
    lastTime: null,
    history: []
  };

  await saveData();
}

loadData();

setInterval(loadData, 3000);

</script>
</body>
</html>
