<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bus Stop System</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #38bdf8;
}

.card {
  background: #1e293b;
  padding: 18px;
  border-radius: 14px;
  margin: 14px 0;
  box-shadow: 0 4px 12px #0005;
}

.label {
  color: #94a3b8;
  font-size: 14px;
}

.value {
  font-size: 25px;
  font-weight: bold;
  margin-top: 8px;
}

.green {
  color: #4ade80;
}

.blue {
  color: #38bdf8;
}

.orange {
  color: #fb923c;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

.next {
  background: #16a34a;
  color: white;
}

.reset {
  background: #dc2626;
  color: white;
}

.test {
  background: #2563eb;
  color: white;
}

li {
  background: #334155;
  padding: 12px;
  border-radius: 8px;
  margin: 8px 0;
  list-style: none;
}

ul {
  padding: 0;
}

.footer {
  text-align: center;
  color: #94a3b8;
  margin: 25px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🚌 SMART BUS STOP</h1>

<div class="card">
  <div class="label">सध्याची वेळ</div>
  <div class="value blue" id="clock">--:--:--</div>
</div>

<div class="card">
  <div class="label">Firebase Status</div>
  <div class="value orange" id="status">CONNECTING...</div>
</div>

<div class="card">
  <div class="label">आलेली बस</div>
  <div class="value green" id="currentBus">अद्याप बस आलेली नाही</div>
  <div id="currentNumber">--</div>
</div>

<div class="grid">

  <div class="card">
    <div class="label">बस आल्याची वेळ</div>
    <div class="value" id="arrivalTime">--</div>
  </div>

  <div class="card">
    <div class="label">एकूण बस काउंट</div>
    <div class="value blue" id="totalCount">0</div>
  </div>

</div>

<div class="card">
  <div class="label">15 मिनिटांचा काउंटडाउन</div>
  <div class="value orange" id="timer">15:00</div>
</div>

<div class="grid">

  <div class="card">
    <div class="label">मागील बस</div>
    <div class="value" id="previousBus">--</div>
  </div>

  <div class="card">
    <div class="label">पुढील बस</div>
    <div class="value green" id="nextBus">BALAJI NAGAR</div>
  </div>

</div>

<div class="card">
  <h3>🚌 बस हिस्ट्री</h3>
  <ul id="history">
    <li>अद्याप कोणतीही बस आलेली नाही.</li>
  </ul>
</div>

<button class="next" onclick="nextBus()">NEXT BUS</button>
<button class="test" onclick="nextBus()">TEST</button>
<button class="reset" onclick="resetData()">RESET</button>

<div class="footer">
  Smart Bus Stop Project
</div>

</div>

<script>

// FIREBASE DATABASE URL
const DB = "https://smart-bus-stop-project-2-default-rtdb.firebaseio.com";

// BUS LIST
const buses = [
  { name: "BALAJI NAGAR", number: "BUS 01" },
  { name: "KATRAJ", number: "BUS 02" },
  { name: "SWARGATE", number: "BUS 03" }
];

let data = {
  count: 0,
  nextIndex: 0,
  lastTime: null,
  history: []
};

// CURRENT CLOCK
function updateClock() {
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString("en-IN");
}

setInterval(updateClock, 1000);
updateClock();

// FIREBASE READ
async function loadData() {
  try {
    const response = await fetch(DB + "/busData.json");

    if (!response.ok) {
      throw new Error("Firebase connection failed");
    }

    const result = await response.json();

    if (result) {
      data = {
        count: Number(result.count) || 0,
        nextIndex: Number(result.nextIndex) || 0,
        lastTime: result.lastTime || null,
        history: Array.isArray(result.history)
          ? result.history
          : []
      };
    }

    document.getElementById("status").innerText =
      "ONLINE";

    document.getElementById("status").className =
      "value green";

    render();

  } catch (error) {

    document.getElementById("status").innerText =
      "OFFLINE";

    document.getElementById("status").className =
      "value orange";
  }
}

// NEXT BUS
async function nextBus() {

  try {

    await loadData();

    const index = data.nextIndex % buses.length;
    const bus = buses[index];

    const now = Date.now();

    const newHistory = [
      {
        bus: bus.name,
        number: bus.number,
        time: new Date(now).toLocaleTimeString("en-IN"),
        timestamp: now
      },
      ...data.history
    ].slice(0, 20);

    const newData = {
      count: data.count + 1,
      nextIndex: (index + 1) % buses.length,
      lastTime: now,
      history: newHistory
    };

    const response = await fetch(DB + "/busData.json", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(newData)
    });

    if (!response.ok) {
      throw new Error("Firebase write failed");
    }

    data = newData;
    render();

  } catch (error) {
    alert("Firebase मध्ये डेटा सेव्ह झाला नाही. कनेक्शन तपासा.");
  }
}

// RESET
async function resetData() {

  if (!confirm("सर्व बस डेटा RESET करायचा आहे का?")) {
    return;
  }

  const emptyData = {
    count: 0,
    nextIndex: 0,
    lastTime: null,
    history: []
  };

  try {

    const response = await fetch(DB + "/busData.json", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(emptyData)
    });

    if (!response.ok) {
      throw new Error("Reset failed");
    }

    data = emptyData;
    render();

  } catch (error) {
    alert("RESET झाले नाही. Firebase तपासा.");
  }
}

// DISPLAY DATA
function render() {

  document.getElementById("totalCount").innerText =
    data.count;

  const current = data.history[0];
  const previous = data.history[1];

  if (current) {

    document.getElementById("currentBus").innerText =
      current.bus;

    document.getElementById("currentNumber").innerText =
      current.number;

    document.getElementById("arrivalTime").innerText =
      current.time;

  } else {

    document.getElementById("currentBus").innerText =
      "अद्याप बस आलेली नाही";

    document.getElementById("currentNumber").innerText =
      "--";

    document.getElementById("arrivalTime").innerText =
      "--";
  }

  document.getElementById("previousBus").innerText =
    previous ? previous.bus : "--";

  const next = buses[data.nextIndex % buses.length];

  document.getElementById("nextBus").innerText =
    next.name;

  const historyElement =
    document.getElementById("history");

  historyElement.innerHTML = "";

  if (data.history.length === 0) {

    historyElement.innerHTML =
      "<li>अद्याप कोणतीही बस आलेली नाही.</li>";

  } else {

    data.history.forEach((item, index) => {

      const li = document.createElement("li");

      li.textContent =
        (index + 1) + ". " +
        item.bus + " - " +
        item.number + " | " +
        item.time;

      historyElement.appendChild(li);

    });

  }

  updateTimer();
}

// 15 MINUTE TIMER
function updateTimer() {

  const timer = document.getElementById("timer");

  if (!data.lastTime) {
    timer.innerText = "15:00";
    return;
  }

  const remaining =
    Math.max(0, 15 * 60 * 1000 -
    (Date.now() - data.lastTime));

  const minutes =
    Math.floor(remaining / 60000);

  const seconds =
    Math.floor((remaining % 60000) / 1000);

  timer.innerText =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}

setInterval(updateTimer, 1000);

// AUTOMATIC DATA REFRESH
loadData();
setInterval(loadData, 5000);

</script>

</body>
</html>
