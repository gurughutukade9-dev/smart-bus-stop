<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bus Stop</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08111f;
    color: white;
}

header {
    text-align: center;
    padding: 25px 15px;
    background: linear-gradient(135deg, #007bff, #00c6ff);
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #142238;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
}

.status {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    padding: 20px;
    background: #0d1829;
    border-radius: 12px;
}

.bus {
    border: 2px solid #2e4059;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
}

.bus h2 {
    margin-top: 0;
}

.active {
    border-color: #00e676;
    background: #102d27;
}

.info {
    color: #b8c7d9;
    line-height: 1.8;
}

button {
    border: none;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

.trigger {
    background: #00c853;
    color: #071b10;
}

.reset {
    background: #ff5252;
    color: white;
}

.buttons {
    text-align: center;
    margin-top: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid #34445a;
    padding: 10px 6px;
    text-align: center;
}

th {
    background: #1c3555;
}

.history {
    overflow-x: auto;
}

footer {
    text-align: center;
    color: #9db0c7;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🚍 SMART BUS STOP</h1>
    <p>Automatic Bus Sequence & Time Tracking</p>
</header>

<div class="container">

    <div class="card">
        <h2>📡 System Status</h2>
        <div class="status" id="nextBus">
            NEXT BUS: BALAJI
